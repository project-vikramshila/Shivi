name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Validate environment files
        run: node -e "require('dotenv').config({ path: '.env.example' }); console.log('Loaded example env');"
      - name: Run type check
        run: npm run type-check
      - name: Build application
        run: npm run build
      - name: Run unit and integration tests
        run: npm test
      - name: Build tests for validation
        run: npm run build:tests
      - name: Save logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shivi-ci-artifacts
          path: |
            dist/**
            logs/**
            tests/reports/**
